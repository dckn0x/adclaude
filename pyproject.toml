[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-cook"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "pyflp>=2.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
cook = "crystal_cook.cli:main"
chop = "crystal_cook.chop_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["crystal_cook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
